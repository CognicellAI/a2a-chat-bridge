discord:
  tokenEnv: DISCORD_BOT_TOKEN
  # Optional: parent channels and the Agent aliases their public threads may use.
  channels: []

# Optional Slack Socket Mode adapter. Shared thread workspace changes require a
# Slack user ID in mutators; DMs do not.
# slack:
#   botTokenEnv: SLACK_BOT_TOKEN
#   appTokenEnv: SLACK_APP_TOKEN
#   channels:
#     - id: C0123456789
#       agents: [concierge]
#       defaultAgent: concierge
#       mutators: [U0123456789]
stateFile: ./data/state.json
editIntervalMs: 1200
pollIntervalMs: 1500
configReloadIntervalMs: 2000

# This local file is the Contact allowlist. The bridge validates and reloads
# Contacts, aliases, and credentials without interrupting an in-flight response.
# Changes to timing, stateFile, or tokenEnv require a restart. Keep real client
# secrets out of Git.
# Replace [] with a list like this to configure an agent:
# agents:
#   - agentCardUrl: https://agent.example/.well-known/agent-card.json
#     alias: concierge
#     auth:
#       type: oauth-client-credentials
#       tokenUrl: https://auth.example/oauth/token
#       clientId: replace-with-client-id
#       clientSecret: replace-with-client-secret
#       scopes: [a2a.invoke]
agents: []
