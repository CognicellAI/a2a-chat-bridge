discord:
  tokenEnv: DISCORD_BOT_TOKEN
  # Optional: parent channels and the Agent aliases their public/private threads may use.
  channels: []

# Optional Slack Socket Mode adapter. Platform membership controls collaboration;
# `agents` limits the remote agents a shared conversation may use.
# Optional cross-adapter private bot-DM policy. Omit to disable private DMs.
# directMessages:
#   agents: [concierge]
#   defaultAgent: concierge
# slack:
#   botTokenEnv: SLACK_BOT_TOKEN
#   appTokenEnv: SLACK_APP_TOKEN
#   conversations:
#     - id: C0123456789
#       agents: [concierge]
#       defaultAgent: concierge
stateFile: ./data/state.json
editIntervalMs: 1200
pollIntervalMs: 1500
configReloadIntervalMs: 2000

# This local file is the Agent allowlist. The bridge validates and reloads
# Agents, aliases, and credentials without interrupting an in-flight response.
# Changes to timing, stateFile, or tokenEnv require a restart. Keep real client
# secrets out of Git.
# Replace [] with a list like this to configure an agent:
# agents:
#   - agentCardUrl: https://agent.example/.well-known/agent-card.json
#     alias: concierge
#     auth:
#       type: oauth-client-credentials
#       tokenUrl: https://auth.example/oauth/token
#       clientId: replace-with-client-id
#       clientSecret: replace-with-client-secret
#       scopes: [a2a.invoke]
agents: []
