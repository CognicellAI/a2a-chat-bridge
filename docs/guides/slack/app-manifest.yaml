display_information:
  name: A2ABridge
features:
  bot_user:
    display_name: A2ABridge
    always_online: true
  slash_commands:
    - command: /a2a
      description: Control an A2A agent workspace
      usage_hint: agent list|use <agent> | session new [agent] [request]
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - channels:read
      - groups:read
settings:
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.mpim
  socket_mode_enabled: true
  token_rotation_enabled: false
