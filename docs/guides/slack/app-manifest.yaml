display_information:
  name: A2ABridge
features:
  bot_user:
    display_name: A2ABridge
    always_online: true
  slash_commands:
    - command: /a2a
      description: Launch an A2A agent workspace
      usage_hint: session new [agent] [request] | agent list
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
settings:
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  socket_mode_enabled: true
  token_rotation_enabled: false
